<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Player Management</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
</head>
<body>
<div class="container">
    <h1 class="mt-5">Cadastro de Jogador</h1>

    <form th:action="@{/player_management}" th:method="post" th:object="${player}">

        <div class="form-group">
            <label for="name">Name:</label>
            <input type="text" id="name" class="form-control" th:field="*{name}" required>
        </div>

        <div class="form-group">
            <label for="email">E-mail:</label>
            <input type="text" id="email" class="form-control" th:field="*{email}" required>
        </div>

        <div class="form-group">
            <label for="phone">Phone:</label>
            <input type="text" id="phone" class="form-control" th:field="*{phone}">
        </div>

        <div class="form-group">
            <label>Escolha um grupo de codinomes:</label>
            <div th:each="group : ${groupsCodenames}" class="form-check">
                <input class="form-check-input" type="radio"
                       th:field="*{groupCodename}"
                       th:value="${group}"
                       th:id="${group.name()}" required>

                <label class="form-check-label"
                       th:for="${group.name()}"
                       th:text="${group.name}"></label>
            </div>
            <div th:if="${#fields.hasErrors('groupCodename')}" th:errors="*{groupCodename}" class="text-danger"></div>
        </div>

        <div class="mt-3">
            <button type="submit" class="btn btn-primary">Cadastrar</button>
            <a th:href="@{/listing-players}" class="btn btn-secondary">Listar Jogadores</a>
        </div>

        <div th:if="${errorMessage}" class="mt-3 alert alert-danger">
            <p th:text="${errorMessage}" class="m-0"></p>
        </div>
    </form>
</div>
</body>
</html>
